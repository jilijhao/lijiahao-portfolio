name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  # 允许在 Actions 页面手动触发（不想等 push 时用）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 随笔的写入入口在页面里（站主用自己的 GitHub 令牌提交 data/memos.json），
      # 所以构建时不能再从外部源覆盖这个文件——那会把页面刚写的内容冲掉。
      # 想从飞书批量导入，用 scripts/sync-memos.mjs 在本地跑，确认后再提交。

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Export
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
