name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  # 允许在 Actions 页面手动触发（飞书里改完想立刻生效时用）
  workflow_dispatch:
  # 定时把飞书表格的最新内容拉过来。cron 是 UTC，对应北京时间 02/08/14/20 点。
  # 备注：公开仓库连续 60 天无提交，schedule 会被 GitHub 自动停用，届时来 Actions 页面点一次启用即可。
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 从飞书多维表格拉随笔写成 data/memos.json。
      # 没配 secrets 时会自己跳过；接口出错时脚本会降级并保留原文件，
      # 站点照常发布（内容源出问题不该把站点拖下水）。这里再把降级翻成醒目警告。
      - name: Sync memos from Feishu
        run: |
          node scripts/sync-memos.mjs | tee /tmp/sync-memos.log
          if grep -qE "SYNC_FAILED|未配置飞书" /tmp/sync-memos.log; then
            echo "::warning::随笔没有同步成功，站点沿用了上一次的内容。原因见上方日志。"
          fi
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Export
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
